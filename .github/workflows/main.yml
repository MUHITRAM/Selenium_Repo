
name: Selenium Java CI Pipeline

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run Selenium Tests
        working-directory: ./com.learning_Selenium
        run: mvn -B clean test -DfailIfNoTests=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            com.learning_Selenium/target/surefire-reports/
          if-no-files-found: ignore
